[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "apiheal"
version = "0.1.0"
description = "Diagnose AI integration failures and propose scoped SDK migrations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "libcst>=1.8,<2",
  "packaging>=24,<27",
  "pydantic>=2.10,<3",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.12,<1"]

[project.scripts]
apiheal = "apiheal.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/apiheal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["docker: opt-in integration tests against prepared Linux Docker images"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
